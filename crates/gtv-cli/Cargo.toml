[package]
name = "gtv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "gtv"
path = "src/main.rs"

[features]
default = []
# Device acceleration for the engine's KNN / as-of operators. Off by default;
# the host path is what GPU-less CI exercises.
cuda = ["gtv-engine/cuda"]

[dependencies]
gtv-core = { path = "../gtv-core" }
gtv-engine = { path = "../gtv-engine" }
gtv-index-store = { path = "../gtv-index-store" }
gtv-params = { path = "../gtv-params" }
gtv-storage = { path = "../gtv-storage" }
arrow.workspace = true
anyhow.workspace = true
rustyline.workspace = true
tokio.workspace = true

[dev-dependencies]
gtv-index = { path = "../gtv-index" }
