[package]
name = "gtv-accelerator-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true

# No new dependencies: the CUDA driver is loaded at runtime through
# `libloading`-style calls to the OS (`LoadLibraryW` / `dlopen`), so building
# this crate needs no CUDA toolkit, no `nvcc`, and no `-lcuda`.
# `libc` is already in the workspace lock file via other crates.
[dependencies]
gtv-accelerator = { path = "../gtv-accelerator" }
gtv-core = { path = "../gtv-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Already in the lock file through gtv-storage. Used by `tests/ptx_stamp.rs` to
# recompute the BLAKE3 of the kernel source and compare it with the hash stamped
# into the committed PTX — the only part of the kernel that a machine without a
# GPU can verify.
blake3.workspace = true
