[package]
name = "gtv-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.94"

[dependencies]
datafusion.workspace = true
arrow.workspace = true
gtv-core = { path = "../gtv-core" }
gtv-array = { path = "../gtv-array" }
gtv-index = { path = "../gtv-index" }
gtv-catalog = { path = "../gtv-catalog" }
gtv-pattern = { path = "../gtv-pattern" }
gtv-pgq = { path = "../gtv-pgq" }
gtv-storage = { path = "../gtv-storage" }
gtv-accelerator = { path = "../gtv-accelerator" }
gtv-params = { path = "../gtv-params" }
thiserror.workspace = true
async-trait = "0.1"
ureq = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow.workspace = true
chrono = "0.4"
blake3.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
# Only for `examples/serve_demo.rs`: the wire server for client development.
# The library itself stays free of the protocol crate (no cycle: gtv-proto
# depends on gtv-core, never on gtv-engine).
gtv-proto = { path = "../gtv-proto" }

[features]
default = []
# Exact LP CRM allocator (Phase 3) over the optimizable pool.
# Enables gtv-array's `crm-lp` feature (pure-Rust microlp backend via good_lp)
# and the `method = 'lp'` dispatch in crm_alloc / crm_audit.
crm-lp = ["gtv-array/crm-lp"]
# Hardware acceleration for exact K-NN and as-of joins. Off by default: the
# host path is what GPU-less CI exercises, and it is the same path a deployment
# falls back to when no device is present.
cuda = ["gtv-accelerator/cuda"]
# NOTE: no feature here may reference a crate under `gtv_ext_lib/`. An
# extension's opt-in feature belongs on the extension crate itself (e.g.
# `gtv-ext-quantum/qoqo`); the core must build with every extension absent.
