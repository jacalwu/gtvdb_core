[package]
name = "gtv-accelerator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Hardware backend. Off by default so GPU-less CI links and tests the exact same
# code path production uses (the host backend), and an operator opts in per
# deployment — mirroring `CUDA_MODE=ON` rather than `AUTO`.
cuda = ["dep:cudarc"]

[dependencies]
arrow.workspace = true
thiserror.workspace = true
gtv-core = { path = "../gtv-core" }
gtv-index = { path = "../gtv-index" }
gtv-params = { path = "../gtv-params" }

# Optional, only with `--features cuda`. `dynamic-loading` keeps the build
# linkable on machines without libcuda and turns a missing driver into a
# runtime `probe()` failure instead of a link error — the same reason
# gtv-cli's example uses it.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13000",
] }

# The CUDA example is skipped by `cargo check --examples` on the default
# (GPU-less) build via `required-features`, instead of failing to find `main`
# when the crate-level `#![cfg(feature = "cuda")]` empties it.
[[example]]
name = "bench_pcie_transfer"
required-features = ["cuda"]

[dev-dependencies]
# `bench_pcie_transfer` maps a scratch file to emulate the `Col::Mapped` mmap
# source that P1b-2 / V-3 registers with `cudaHostRegister`.
memmap2 = "0.9"
