name: Publish Python local driver

# Tag-driven release of `pygtvdb-local`, the in-process (DuckDB-style) driver.
#
# This one differs from `publish-python.yml` in the one way that matters: there
# is a compiled engine inside, so a single universal artefact cannot exist. The
# build is a matrix, and `publish` waits for every platform before touching the
# index — a half-published release would leave users on one OS with no wheel.
#
# One-time setup is in python_local/PUBLISHING.md: PyPI must have a pending
# publisher naming this workflow and the `pypi` environment below, or the OIDC
# exchange is rejected before any file is considered.
on:
  push:
    tags: ["pyl-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: a missing platform is worse than a failed release, because
      # pip would resolve an older version on that OS without saying so.
      fail-fast: true
      matrix:
        # macos-latest is arm64. For Intel Macs add `macos-13`; the wheel tag
        # is taken from the runner, so both can coexist in one release.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - id: version
        name: Version tag must match pygtvdb_local/_version.py
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "exec(open('python_local/pygtvdb_local/_version.py').read()); print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#pyl-v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag pyl-v$tag does not match python_local/pygtvdb_local/_version.py ($version)"
              exit 1
            fi
          fi

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip build "pyarrow>=14"

      # The same script a contributor runs, so a green release proves the
      # documented local command works on this platform.
      - name: Build extension and wheel
        run: python python_local/build_native.py --wheel

      # Never tag a release that has not passed the suite on the platform it
      # is being published for.
      - name: PEP 249 conformance against the embedded engine
        run: python -m unittest discover -s python_local/tests -t python_local/tests

      - name: The wheel installs and answers a query
        run: python python_local/check_wheel.py

      - uses: actions/upload-artifact@v4
        with:
          name: python-local-dist-${{ matrix.os }}
          path: python_local/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write # OIDC token exchanged for a short-lived PyPI credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-local-dist-*
          merge-multiple: true
          path: dist/

      # Every platform must be present: a partial upload cannot be corrected
      # for this version, because a version number is burned once uploaded.
      - name: Require a wheel for every platform
        run: |
          set -euo pipefail
          ls -lh dist/
          count=$(ls dist/*.whl | wc -l)
          echo "wheels: $count"
          if [ "$count" -lt 3 ]; then
            echo "::error::expected 3 platform wheels, found $count — refusing to publish"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: false
          print-hash: true

  release:
    name: Attach wheels to the GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag' && (github.event.inputs.target || 'pypi') == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-local-dist-*
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
