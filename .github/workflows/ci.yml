name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Hard rule: generated datasets never enter version control. The core split
  # also excludes Parquet/PDF blobs that used to live in the monorepo.
  generated-data:
    name: No generated data in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked generated datasets
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '\.(csv|seg|gtvd|gtvobs|parquet|pdf)$|nodes_c[0-9]+\.bin$' || true)
          if [ -n "$bad" ]; then
            echo "::error::generated data is tracked; regenerate it instead of committing it"
            echo "$bad"
            exit 1
          fi
          echo "OK: no tracked generated datasets"

  # The reason this repository exists: the core must stay core. Guard both the
  # file tree and the actual resolved dependency graph, so a workload crate
  # cannot sneak back in through a Cargo.toml or a transitive edge.
  core-boundary:
    name: Core contains no extension code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned by rust-toolchain.toml (1.95.0). Do NOT use
      # dtolnay/rust-toolchain@stable here: a moving toolchain hid the gap
      # between the documented MSRV and the one Cargo.lock actually needs.
      - name: Verify pinned toolchain (rust-toolchain.toml)
        run: |
          rustc --version
          rustc --version | grep -q '1\.95\.' || { echo "::error::expected rustc 1.95.x from rust-toolchain.toml"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: No extension tree or manifest dependency
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '^gtv_ext_lib/'; then
            echo "::error::extension sources are present in the core repository"
            exit 1
          fi
          if grep -RInE 'path\s*=\s*"[^"]*gtv_ext_lib' --include='Cargo.toml' .; then
            echo "::error::a manifest points at the extension tree"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*gtv-(ext-|crypto|quantum|q|shm|cbom|scenario|governance|refdata|largeexposure|enterprise-sql)[[:space:]]*=' --include='Cargo.toml' .; then
            echo "::error::a manifest declares an extension crate as a dependency"
            exit 1
          fi
          echo "OK: no extension tree and no extension manifest dependency"
      - name: Resolved dependency graph is core-only
        run: |
          set -euo pipefail
          bad_re='^gtv-(ext-|quantum|largeexposure|scenario|governance|enterprise-sql|crypto|cbom|q|refdata|shm)'
          fail=0
          for pkg in gtv-core gtv-array gtv-index gtv-index-store gtv-storage \
                     gtv-catalog gtv-pattern gtv-ingest gtv-udf gtv-proto gtv-delta \
                     gtv-params gtv-accelerator gtv-engine gtv-cli; do
            deps=$(cargo tree -p "$pkg" --edges normal --prefix none | awk '{print $1}' | sort -u)
            if echo "$deps" | grep -Eq "$bad_re"; then
              echo "::error::$pkg depends on an extension crate"
              echo "$deps" | grep -E "$bad_re"
              fail=1
            fi
          done
          exit $fail

  # The front door: if the workspace does not compile, nothing else matters.
  workspace-build:
    name: Workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned by rust-toolchain.toml (1.95.0). Do NOT use
      # dtolnay/rust-toolchain@stable here: a moving toolchain hid the gap
      # between the documented MSRV and the one Cargo.lock actually needs.
      - name: Verify pinned toolchain (rust-toolchain.toml)
        run: |
          rustc --version
          rustc --version | grep -q '1\.95\.' || { echo "::error::expected rustc 1.95.x from rust-toolchain.toml"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: Build all crates
        run: cargo build --workspace --all-targets

  # The kernel is where the moat is (temporal CSR, ANN, provenance, GTVSeg).
  kernel-tests:
    name: Kernel + temporal graph tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned by rust-toolchain.toml (1.95.0). Do NOT use
      # dtolnay/rust-toolchain@stable here: a moving toolchain hid the gap
      # between the documented MSRV and the one Cargo.lock actually needs.
      - name: Verify pinned toolchain (rust-toolchain.toml)
        run: |
          rustc --version
          rustc --version | grep -q '1\.95\.' || { echo "::error::expected rustc 1.95.x from rust-toolchain.toml"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: Core kernel (temporal CSR, provenance, bitemporal)
        run: cargo test -p gtv-core
      - name: Vector index
        run: cargo test -p gtv-index
      - name: Parameter file (M16)
        run: cargo test -p gtv-params
      - name: Device acceleration host paths (M17/M18)
        run: cargo test -p gtv-accelerator
      - name: Temporal pattern matching
        run: cargo test -p gtv-pattern
      - name: Temporal + state-graph SQL surface
        run: cargo test -p gtv-engine --test bitemporal --test quantum_state
      - name: GTVSeg read path (P0) and write path (P1)
        run: cargo test -p gtv-storage --test segment --test p1_write_path
      - name: Segment SQL surface
        run: cargo test -p gtv-engine --test segment_sql --test p1_segment_store_sql
      - name: Metadata layers (L1 catalog surface, L2 time box)
        run: |
          cargo test -p gtv-storage --test l2_time_box
          cargo test -p gtv-engine --test l1_catalog_meta --test l2_segment_prune_sql
      - name: M1 corrections (retract fold, property test, crash recovery)
        run: |
          cargo test -p gtv-storage --test m1_correction
          cargo test -p gtv-engine --test m1_invalidation_sql
      - name: M2 control plane (worker compaction, delayed GC, observations, aggregates)
        run: |
          cargo test -p gtv-storage --test m2_control_plane
          cargo test -p gtv-engine --test m2_aggregate_sql
      - name: M2 control-plane regression gate
        run: cargo run --release -p gtv-storage --example bench_correction
      - name: M3 admission (bitmap, tags, GC pinning, maintenance worker)
        run: |
          cargo test -p gtv-storage --test m3_admission
          cargo test -p gtv-engine --test m3_tags_sql
      - name: M3 admission gate (evidence for go/no-go decisions)
        run: cargo run --release -p gtv-storage --example bench_m3_gate
      - name: M6 batch graph operator (row-for-row parity with pointwise UDTFs)
        run: cargo test -p gtv-engine --test m6_batch_graph
      - name: M6 admission gate (target query latency + segment granularity)
        run: cargo run --release -p gtv-engine --example bench_m6_gate
      - name: P1-4 motif SQL (row-for-row parity + admission gate)
        run: |
          cargo test -p gtv-engine --test p1_4_motif_sql
          cargo run --release -p gtv-engine --example bench_motif_gate

  full-tests:
    name: Full workspace regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain is pinned by rust-toolchain.toml (1.95.0). Do NOT use
      # dtolnay/rust-toolchain@stable here: a moving toolchain hid the gap
      # between the documented MSRV and the one Cargo.lock actually needs.
      - name: Verify pinned toolchain (rust-toolchain.toml)
        run: |
          rustc --version
          rustc --version | grep -q '1\.95\.' || { echo "::error::expected rustc 1.95.x from rust-toolchain.toml"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - name: All tests including doctests
        run: cargo test --workspace --no-fail-fast

  # The `gtvdb` driver in python/ is a shipping artefact: users `pip install` it.
  # Its two failure modes are a stub that drifted from the .proto and a wheel
  # that cannot be installed — both are cheap to catch here.
  python-driver:
    name: Python driver (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the declared `requires-python`.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime and test deps
        # grpcio-tools is pinned, not floored: the stub check compares protoc's
        # output byte-for-byte against the committed files, so a newer protoc
        # would fail the job for a reason that has nothing to do with the .proto.
        run: |
          python -m pip install --upgrade pip wheel "grpcio>=1.60" "pyarrow>=14" pandas
          python -m pip install "grpcio-tools==1.85.3"
      - name: Stubs match crates/gtv-proto/proto/gtvquery.proto
        run: python python/gen_stubs.py --check
      - name: PEP 249 contract and wire round-trip
        run: python -m unittest discover -s python/tests -t python/tests

  python-package:
    name: Python packaging gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling and runtime deps
        run: python -m pip install --upgrade pip build twine wheel "grpcio>=1.60" "pyarrow>=14" pandas
      # --offline: a pull request must not depend on pypi.org being reachable,
      # and must not query whether a version exists (it may already, by design).
      # --allow-missing-engine: this job does not build the native artefact —
      # the three-platform job below is what proves the engine ships. Both
      # shapes are real: a remote-only wheel is a legitimate build, it just has
      # to say so at `connect("gtv://local")`.
      - name: Release pre-flight (build, twine check, artefact contents)
        run: python python/check_release.py --offline --allow-missing-engine

  # `pygtvdb` now carries the engine for `connect("gtv://local")`, so the wheel
  # is platform-specific: three platforms, one Python (abi3 covers 3.9-3.13).
  #
  # This job is the one that proves the in-process half works. The plain
  # `python-driver` job above runs the same suite on a machine with no engine,
  # where the in-process tests skip — together they cover both shapes of the
  # distribution.
  python-local-driver:
    name: In-process engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Toolchain is pinned by rust-toolchain.toml; do not ask for @stable.
      - uses: Swatinem/rust-cache@v2
        with:
          # The extension links the whole workspace, so the cache key must move
          # with the lockfile or CI would silently reuse stale objects.
          workspaces: ". -> target"
      - name: Install test dependencies
        # The suite is one file set: the in-process tests need pyarrow, the
        # remote ones need grpcio (their fake server is Python), and the pandas
        # interop test needs pandas. Installing only pyarrow makes the job fail
        # in `test_dbapi` for a reason that looks unrelated to this job's name.
        run: |
          python -m pip install --upgrade pip "grpcio>=1.60" "pyarrow>=14" pandas
      # Same entry point a human runs locally: normalises the lld/sccache/MSVC
      # environment traps, builds, and drops the artefact into gtvdb/_local/.
      - name: Build the extension and the wheel
        run: python python/build_native.py --wheel
      - name: Full suite (remote, in-process, dispatch)
        run: python -m unittest discover -s python/tests -t python/tests
      # A wheel that builds is not a wheel that works: this installs it into a
      # temp dir and queries through it from outside the source tree.
      - name: The wheel installs and answers a local query
        run: python python/check_wheel.py

