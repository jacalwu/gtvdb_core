name: Publish Python driver

# Tag-driven releases of the `gtvdb` driver (python/). Uses PyPI trusted
# publishing: no API token is stored in the repository. One-time setup is
# described in python/PUBLISHING.md — the publisher must name this workflow and
# the environment below, or the OIDC exchange will be rejected.
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling and runtime deps
        run: python -m pip install --upgrade pip build twine "grpcio>=1.60" "pyarrow>=14" pandas

      - id: version
        name: Version tag must match gtvdb/_version.py
        run: |
          set -euo pipefail
          version=$(python -c "exec(open('python/gtvdb/_version.py').read()); print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#py-v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag py-v$tag does not match python/gtvdb/_version.py ($version)"
              exit 1
            fi
          fi

      # The same gate a maintainer runs locally, so CI and laptop cannot disagree.
      - name: Release pre-flight
        run: python python/check_release.py --keep-dist

      - name: Upload artefacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write # OIDC token exchanged for a short-lived PyPI credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # A tag push must never overwrite: every version is immutable anyway,
          # but failing early gives a clearer message than a 400 from the index.
          skip-existing: false
          print-hash: true

  release:
    name: Attach artefacts to the GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag' && (github.event.inputs.target || 'pypi') == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
