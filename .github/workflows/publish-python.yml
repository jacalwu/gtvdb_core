name: Publish Python driver

# Tag-driven release of `pygtvdb`.
#
# The distribution carries the in-process engine, so `connect("gtv://local")`
# works without a server — which makes the wheel platform-specific. Three
# platforms build in parallel and `publish` waits for all of them: a partial
# matrix is worse than a failed release, because pip on the missing platform
# silently resolves an older pure-Python version instead of saying no.
#
# No sdist is uploaded on purpose. An sdist has no compiled engine, so pip on a
# machine without a Rust toolchain would try to build one and fail; shipping only
# per-platform wheels means every install is complete.
#
# One-time setup is in python/PUBLISHING.md: PyPI must have a pending publisher
# naming this workflow and the `pypi` environment below, or the OIDC exchange is
# rejected before any file is considered.
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: a missing platform is worse than a failed release.
      fail-fast: true
      matrix:
        # macos-latest is arm64. For Intel Macs add `macos-13`; the tag comes
        # from the runner, so both can coexist in one release.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - id: version
        name: Version tag must match gtvdb/_version.py
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "exec(open('python/gtvdb/_version.py').read()); print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#py-v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag py-v$tag does not match python/gtvdb/_version.py ($version)"
              exit 1
            fi
          fi

      - name: Install build and test dependencies
        # Everything the two gates below need, in one place: the suite needs
        # grpcio + pandas, `check_release.py` regenerates the stubs (so
        # grpcio-tools, pinned because that comparison is byte-for-byte) and
        # runs `twine check`.
        # One line on purpose: this step runs under PowerShell on Windows, which
        # does not treat a trailing backslash as a line continuation — it passes
        # it as an argument and then runs the next line as a new command.
        run: python -m pip install --upgrade pip build twine wheel "grpcio>=1.60" "pyarrow>=14" pandas "grpcio-tools==1.85.3"

      # The same script a contributor runs, so a green release proves the
      # documented local command works on this platform.
      # `tee` keeps the full log (the build takes minutes and the interesting
      # line is usually the first error, not the last), and the step below turns
      # those lines into annotations — which are readable without the job log.
      - name: Build the extension and the wheel
        shell: bash
        run: |
          set -o pipefail
          python python/build_native.py --wheel 2>&1 | tee build.log

      - name: Surface the first build errors
        if: failure()
        shell: bash
        run: |
          file=build.log
          [ -f "$file" ] || file="$RUNNER_TEMP/build.log"
          grep -nE "^(error|error\[)|error: |undefined symbol|ld: |clang: error|LINK : fatal|cannot find|No such file" \
            "$file" 2>/dev/null | head -12 | while IFS= read -r line; do
              echo "::error::${line}"
            done

      # Never tag a release that has not passed the suite where it is shipped.
      # `working-directory: python` is what makes `import gtvdb` resolve: the
      # suite runs from a checkout, not from an installed distribution, and this
      # is the same invocation `check_release.py` uses.
      - name: Full suite (remote, in-process, dispatch)
        working-directory: python
        run: python -m unittest discover -s tests -t tests

      - name: The wheel installs and answers a local query
        # --fresh-venv: install into a new virtualenv so only the dependencies
        # the wheel declares are present. The fast path runs beside this
        # machine's site-packages, where a missing Requires-Dist is invisible.
        run: python python/check_wheel.py --fresh-venv

      # The release must also pass the same metadata gate a maintainer runs.
      # --offline: a tag push must not depend on PyPI being reachable to ask
      # whether this version exists; the index answer is the same either way.
      # NOT --keep-dist: that builds into python/dist and would overwrite the
      # manylinux-tagged wheel with a generic `linux_x86_64` one, which PyPI
      # rejects. build_native.py's wheel is the one upload-artifact must ship.
      - name: Release pre-flight (metadata, artefact contents)
        run: python python/check_release.py --offline

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      id-token: write # OIDC token exchanged for a short-lived PyPI credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist/

      # Every platform must be present: a partial upload cannot be corrected for
      # this version, because a version number is burned once uploaded.
      - name: Require a wheel for every platform
        run: |
          set -euo pipefail
          ls -lh dist/
          count=$(ls dist/*.whl | wc -l)
          echo "wheels: $count"
          if [ "$count" -lt 3 ]; then
            echo "::error::expected 3 platform wheels, found $count — refusing to publish"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/
          # 0.2.0 was first published with only the Windows wheel. PyPI allows
          # adding platform wheels to an existing version, but only when the
          # uploader skips files that are already there. Without this, the
          # three-platform matrix fails on the duplicate Windows file and the
          # Linux wheel never reaches the index.
          skip-existing: true
          print-hash: true

  release:
    name: Attach wheels to the GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag' && (github.event.inputs.target || 'pypi') == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
